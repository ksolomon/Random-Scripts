# Example backup-cron config
# Save as one of:
#   /etc/backup-cron.conf
#   ~/.config/backup-cron.conf
#   ~/.backup-cron.conf

# Required: destination directory for generated .tar.gz files.
BACKUP_DEST="/storage/Backups/Docker/Banshee"

# Required: list of directories to archive.
BACKUP_SOURCES=(
  "/path1"
  "/path2"
  "/path3"
)

# Optional settings:
BACKUP_PREFIX="backup"
BACKUP_HOSTNAME_MODE="short" # short|full|none
BACKUP_COMPRESS_LEVEL="6"    # gzip 1-9
BACKUP_KEEP_DAYS="3"         # 0 disables pruning
BACKUP_KEEP_LATEST="3"       # 0 disables count-based pruning
BACKUP_STRICT_SOURCES="1"    # 1 fail on missing source; 0 skip missing source

# Optional log file. Useful for cron.
BACKUP_LOG_FILE="/var/log/docker-backup.log"
